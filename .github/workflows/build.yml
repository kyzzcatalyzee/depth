name: Build DepthLock

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg make

      - name: Setup Theos (roothide fork)
        run: |
          git clone --recursive https://github.com/roothide/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Download iOS SDK
        run: |
          git clone --depth 1 https://github.com/theos/sdks.git /tmp/sdks
          ls /tmp/sdks
          mkdir -p "$HOME/theos/sdks"
          SDK=$(ls -d /tmp/sdks/iPhoneOS16*.sdk | sort -V | tail -n 1)
          echo "Memakai SDK: $SDK"
          cp -R "$SDK" "$HOME/theos/sdks/"

      - name: Build package
        run: |
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make package FINALPACKAGE=1

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: DepthLock-deb
          path: packages/*.deb
